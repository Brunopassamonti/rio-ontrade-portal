<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validação Geo · Botafogo–Humaitá</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font:12px Arial;background:#f2eee3;color:#111}.top{padding:12px 16px;background:#11372a;color:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.top b{font-size:18px}.top button,.top a{padding:8px 10px;border:0;border-radius:6px;background:#fff;color:#111;text-decoration:none;font-weight:700;cursor:pointer}.grid{height:calc(100vh - 58px);display:grid;grid-template-columns:320px 1fr 1fr}.side{padding:12px;overflow:auto;background:#fff}.mapbox,.gbox{position:relative}.mapbox #map{height:100%}.gbox iframe{width:100%;height:100%;border:0}input,select{width:100%;padding:8px;margin:4px 0 10px;border:1px solid #bbb;border-radius:6px}.item{padding:8px 0;border-bottom:1px solid #ddd;cursor:pointer}.item.active{background:#e6f3eb}.meta{font-size:10px;color:#666}.ok{color:#137a42;font-weight:700}.pend{color:#b06a20;font-weight:700}.panel{position:absolute;left:10px;bottom:10px;z-index:500;background:#fff;padding:10px;border:1px solid #111;border-radius:8px;max-width:330px}.panel button{margin:4px 4px 0 0;padding:7px 9px}@media(max-width:900px){.grid{grid-template-columns:1fr;grid-template-rows:40vh 50vh 50vh;height:auto}.side{height:40vh}.mapbox,.gbox{height:50vh}}</style></head><body><div class="top"><b>Validação de coordenadas · 95 PDVs</b><a href="index.html">← mapa principal</a><button id="exportJson">Exportar JSON</button><button id="exportCsv">Exportar CSV</button><span id="count"></span></div><div class="grid"><div class="side"><input id="search" placeholder="Buscar PDV ou rua"><select id="zone"><option value="">Todas as áreas</option></select><div id="list"></div></div><div class="mapbox"><div id="map"></div><div class="panel"><b id="selName">Selecione um PDV</b><div id="selAddr"></div><div id="coords"></div><button id="save">Salvar posição</button><button id="reset">Voltar ao aproximado</button><div style="margin-top:6px;font-size:10px">Arraste o pin até a porta correta comparando com o Google Maps ao lado.</div></div></div><div class="gbox"><iframe id="gmap" loading="lazy"></iframe></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>let DATA=[],FIXED={},sel=null,marker=null,approx={};const files=[1,2,3,4,5].map(n=>`data/pdv-${n}.json`),map=L.map('map').setView([-22.9565,-43.188],14.5);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);function key(v){return v.name+'|'+v.address}function embed(v){return'https://www.google.com/maps?q='+encodeURIComponent(v.name+' '+v.address)+'&output=embed'}async function geo(v){for(const q of [v.name+', '+v.address,v.address]){try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q='+encodeURIComponent(q)),a=await r.json();if(a.length)return{lat:+a[0].lat,lng:+a[0].lon}}catch(e){}}return null}async function choose(v){sel=v;document.querySelectorAll('.item').forEach(x=>x.classList.toggle('active',x.dataset.k===key(v)));document.getElementById('selName').textContent=v.name;document.getElementById('selAddr').textContent=v.address;document.getElementById('gmap').src=embed(v);let z=FIXED[key(v)]||approx[key(v)];if(!z){z=await geo(v);if(z)approx[key(v)]=z}if(!z)return;if(marker)map.removeLayer(marker);marker=L.marker([z.lat,z.lng],{draggable:true}).addTo(map);map.setView([z.lat,z.lng],18);showCoords();marker.on('drag',showCoords)}function showCoords(){if(!marker)return;const z=marker.getLatLng();document.getElementById('coords').textContent=`${z.lat.toFixed(7)}, ${z.lng.toFixed(7)} ${FIXED[key(sel)]?'✓ salvo':''}`}function save(){if(!sel||!marker)return;const z=marker.getLatLng();FIXED[key(sel)]={lat:+z.lat.toFixed(7),lng:+z.lng.toFixed(7),status:'validated',validated_at:new Date().toISOString()};localStorage.setItem('bh_fixed_coords_work',JSON.stringify(FIXED));render();showCoords()}function reset(){if(!sel)return;delete FIXED[key(sel)];localStorage.setItem('bh_fixed_coords_work',JSON.stringify(FIXED));choose(sel);render()}function render(){const q=document.getElementById('search').value.toLowerCase(),zone=document.getElementById('zone').value,el=document.getElementById('list');el.innerHTML='';DATA.filter(v=>(!q||(v.name+' '+v.address).toLowerCase().includes(q))&&(!zone||v.hotzone===zone)).forEach(v=>{const d=document.createElement('div');d.className='item';d.dataset.k=key(v);d.innerHTML=`<b>${v.name}</b><div class=meta>${v.address}</div><div class="${FIXED[key(v)]?'ok':'pend'}">${FIXED[key(v)]?'✓ validado':'~ pendente'}</div>`;d.onclick=()=>choose(v);el.appendChild(d)});document.getElementById('count').textContent=`${Object.keys(FIXED).length}/${DATA.length} validados`}function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}document.getElementById('save').onclick=save;document.getElementById('reset').onclick=reset;document.getElementById('search').oninput=render;document.getElementById('zone').onchange=render;document.getElementById('exportJson').onclick=()=>download('fixed-coords.json',JSON.stringify(FIXED,null,2),'application/json');document.getElementById('exportCsv').onclick=()=>{let rows=[['PDV','Endereco','Latitude','Longitude','Status']];DATA.forEach(v=>{let z=FIXED[key(v)];if(z)rows.push([v.name,v.address,z.lat,z.lng,z.status])});download('coordenadas-validadas.csv',rows.map(r=>r.map(x=>`"${String(x??'').replaceAll('"','""')}"`).join(',')).join('\n'),'text/csv')};(async()=>{const [chunks,pub]=await Promise.all([Promise.all(files.map(f=>fetch(f).then(r=>r.json()))),fetch('data/fixed-coords.json').then(r=>r.ok?r.json():{})]);DATA=chunks.flat();FIXED={...pub,...JSON.parse(localStorage.getItem('bh_fixed_coords_work')||'{}')};const zs=[...new Set(DATA.map(v=>v.hotzone).filter(Boolean))].sort();document.getElementById('zone').innerHTML+=zs.map(z=>`<option>${z}</option>`).join('');render();if(DATA.length)choose(DATA[0])})();</script></body></html>
