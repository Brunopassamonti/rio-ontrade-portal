<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hotzone Intelligence — Botafogo v13</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--bg:#f3efe4;--ink:#161616;--green:#18864b;--orange:#e56a2e;--dark:#103726}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}.app{display:grid;grid-template-columns:340px 1fr;height:100vh}aside{background:var(--dark);color:#fff;padding:20px;overflow:auto}h1{margin:0;font-size:28px;line-height:1;text-transform:uppercase}.sub{font-size:12px;line-height:1.5;color:#d9e7de;margin:8px 0 18px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:10px;border:1px solid rgba(255,255,255,.1);border-radius:9px;background:rgba(255,255,255,.05)}.metric strong{display:block;font-size:26px}.metric span{font-size:9px;text-transform:uppercase;color:#cfe0d5}.section-title{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#a5bdae;margin:20px 0 8px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px}button{padding:9px;border:0;border-radius:7px;background:#fff;font-weight:700;text-align:left;cursor:pointer}button.active{background:#d7f1e0}.list-item{padding:7px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:11px}.meta{display:block;color:#b9cec0;font-size:10px;margin-top:2px}main{position:relative}#map{height:100%;width:100%}.leaflet-tile-pane{filter:grayscale(88%) brightness(1.04) contrast(.9)}.legend{position:absolute;top:12px;right:12px;z-index:500;background:rgba(255,253,248,.97);border:1px solid #111;border-radius:8px;padding:10px 12px;font-size:11px;line-height:1.7}.legend-pin{display:inline-block;width:18px;height:24px;margin-right:6px;vertical-align:middle}.legend-pin svg{width:18px;height:24px}.label-tooltip{background:rgba(255,253,248,.94);border:1px solid #111;color:#111;padding:2px 5px;border-radius:4px;font-size:10px;font-weight:700;box-shadow:none;white-space:nowrap}.label-tooltip:before{display:none!important}.popup h3{margin:0 0 5px;font-size:15px}.popup p{margin:3px 0;font-size:11px}.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.links a{padding:5px 7px;background:#f1eee5;border:1px solid #cec6b4;border-radius:5px;color:#111;text-decoration:none;font-size:11px}@media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{max-height:46vh}}</style></head><body><div class="app"><aside><h1>Botafogo<br>Hotzone</h1><div class="sub"><b>Verde</b> = presença Jäger confirmada / implantação. <b>Laranja</b> = presença não confirmada.</div><div class="metrics"><div class="metric"><strong>38</strong><span>contas</span></div><div class="metric"><strong>12</strong><span>com Jäger</span></div></div><div class="section-title">Filtros</div><div class="controls"><button class="active" data-filter="all">Todas</button><button data-filter="jager">Com Jäger</button><button data-filter="non">Sem confirmação</button><button data-filter="core">AQ + FG</button></div><div class="section-title">Bares visíveis</div><div id="list"></div></aside><main><div id="map"></div><div class="legend"><div><span class="legend-pin"><svg viewBox="0 0 24 32"><path d="M12 1C5.9 1 1 5.9 1 12c0 8.2 11 19 11 19s11-10.8 11-19C23 5.9 18.1 1 12 1z" fill="#18864b" stroke="#111" stroke-width="1.2"/><circle cx="12" cy="12" r="4" fill="#fff"/></svg></span>Jäger presente / implantação</div><div><span class="legend-pin"><svg viewBox="0 0 24 32"><path d="M12 1C5.9 1 1 5.9 1 12c0 8.2 11 19 11 19s11-10.8 11-19C23 5.9 18.1 1 12 1z" fill="#e56a2e" stroke="#111" stroke-width="1.2"/><circle cx="12" cy="12" r="4" fill="#fff"/></svg></span>Presença não confirmada</div></div></main></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const D=[['Fala Bar','Rua Oliveira Fausto, 29',0,'Oliveira Fausto'],['Chora Café','Rua Oliveira Fausto, 28',0,'Oliveira Fausto'],['Escuta','Rua General Polidoro, 12',0,'General Polidoro'],['Brizza','Rua Fernandes Guimarães, 64',1,'Fernandes Guimarães'],['Meia Noite – Meio Dia','Rua Fernandes Guimarães, 31B',0,'Fernandes Guimarães'],['Vuvu','Rua Sorocaba, 601',1,'Sorocaba'],['Satay','Rua Mena Barreto, 90',0,'Mena Barreto'],['Bukowski','Rua Álvaro Ramos, 270',1,'Álvaro Ramos'],['Chanchada','Rua General Polidoro, 164B',0,'General Polidoro'],['Frisson Rio','Rua Dezenove de Fevereiro, 190',0,'Dezenove de Fevereiro'],['Surreal','Rua Paulo Barreto, 102',1,'Paulo Barreto'],['Bar Tero','Rua Paulo Barreto, 110',0,'Paulo Barreto'],['Porco Amigo','Rua São Manuel, 43',0,'São Manuel'],['Jah Warma','Rua Arnaldo Quintela, 51B',1,'Arnaldo Quintela'],['Calma Bar','Rua Arnaldo Quintela, 51',1,'Arnaldo Quintela'],['Treme Treme','Rua Arnaldo Quintela, 31',1,'Arnaldo Quintela'],['Macuna','Rua Fernandes Guimarães, 66',1,'Fernandes Guimarães'],['Canastra Rosé','Rua Álvaro Ramos, 154',1,'Álvaro Ramos'],['Xepa','Rua Arnaldo Quintela, 87',1,'Arnaldo Quintela'],['Quartinho','Rua Arnaldo Quintela, 124',0,'Arnaldo Quintela'],['Culto','Rua Arnaldo Quintela, 89',0,'Arnaldo Quintela'],['Ferro e Farinha','Rua Arnaldo Quintela, 23',0,'Arnaldo Quintela'],['Lemô','Rua Arnaldo Quintela, 57',0,'Arnaldo Quintela'],['O Glorioso','Rua Fernandes Guimarães, 53',0,'Fernandes Guimarães'],['Marinos','Rua Fernandes Guimarães, 55',0,'Fernandes Guimarães'],['Batô','Rua Fernandes Guimarães, 58',1,'Fernandes Guimarães'],['Casa Tão Longe, Tão Perto','Rua Fernandes Guimarães, 93',0,'Fernandes Guimarães'],['Belisco','Rua Arnaldo Quintela, 93',0,'Arnaldo Quintela'],['Cave Nacional','Rua Dezenove de Fevereiro, 151',0,'Dezenove de Fevereiro'],['Hocus Pocus DNA','Rua Dezenove de Fevereiro, 186',0,'Dezenove de Fevereiro'],['Coordenadas','Rua da Passagem, 19',0,'da Passagem'],['Guadalupe','Rua Real Grandeza, 193',0,'Real Grandeza'],['Caju Gastrobar','Rua General Polidoro, 171',0,'General Polidoro'],['Bar Arnaldo Quintela','Rua Arnaldo Quintela, 3',0,'Arnaldo Quintela'],['SULT','Rua Fernandes Guimarães, 77',0,'Fernandes Guimarães'],['Seu Rufino','Rua Fernandes Guimarães, 82',0,'Fernandes Guimarães'],['Broto Pizza','Rua Álvaro Ramos, 171',0,'Álvaro Ramos'],['Blue Blazer','Rua Álvaro Ramos, 11, sobreloja',1,'Álvaro Ramos']].map(x=>({name:x[0],address:x[1]+', Botafogo, Rio de Janeiro, RJ, Brazil',jager:!!x[2],street:x[3]}));const map=L.map('map').setView([-22.9563,-43.1847],15.2);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);let cache=JSON.parse(localStorage.getItem('hotzone_v13pins')||'{}'),pts=[],filter='all';async function geo(a){if(cache[a])return cache[a];const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q='+encodeURIComponent(a));const x=await r.json();if(!x.length)return null;const p={lat:+x[0].lat,lng:+x[0].lon};cache[a]=p;localStorage.setItem('hotzone_v13pins',JSON.stringify(cache));return p}function pin(color){return L.divIcon({className:'',html:`<svg viewBox="0 0 24 32" width="28" height="38"><path d="M12 1C5.9 1 1 5.9 1 12c0 8.2 11 19 11 19s11-10.8 11-19C23 5.9 18.1 1 12 1z" fill="${color}" stroke="#111" stroke-width="1.25"/><circle cx="12" cy="12" r="4" fill="#fff"/></svg>`,iconSize:[28,38],iconAnchor:[14,37],popupAnchor:[0,-34],tooltipAnchor:[14,-20]})}function show(v){return filter==='all'||(filter==='jager'&&v.jager)||(filter==='non'&&!v.jager)||(filter==='core'&&['Arnaldo Quintela','Fernandes Guimarães'].includes(v.street))}function maps(v){return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(v.address)}function render(){const list=document.getElementById('list');list.innerHTML='';const visible=[];pts.forEach(o=>{if(show(o.v)){if(!map.hasLayer(o.m))o.m.addTo(map);visible.push(o.m);const d=document.createElement('div');d.className='list-item';d.innerHTML=`<b>${o.v.name}</b><span class="meta">${o.v.street} · ${o.v.jager?'Jäger':'não confirmado'}</span>`;d.onclick=()=>{map.setView([o.lat,o.lng],18);o.m.openPopup()};list.appendChild(d)}else if(map.hasLayer(o.m))map.removeLayer(o.m)});if(visible.length)map.fitBounds(L.featureGroup(visible).getBounds().pad(.12))}document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});(async()=>{for(const v of D){try{const p=await geo(v.address);if(!p)continue;const color=v.jager?'#18864b':'#e56a2e';const m=L.marker([p.lat,p.lng],{icon:pin(color)}).addTo(map);m.bindTooltip(v.name,{permanent:true,direction:'right',offset:[10,-18],className:'label-tooltip'});m.bindPopup(`<div class="popup"><h3>${v.name}</h3><p>${v.address.replace(', Rio de Janeiro, RJ, Brazil','')}</p><p><b>Status:</b> ${v.jager?'Jäger presente / implantação':'Presença não confirmada'}</p><div class="links"><a target="_blank" href="${maps(v)}">Google Maps</a></div></div>`);pts.push({v,m,lat:p.lat,lng:p.lng})}catch(e){}await new Promise(r=>setTimeout(r,60))}render()})();</script></body></html>
